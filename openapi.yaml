openapi: 3.0.3
info:
  title: SLSEA Solar Generation Data API
  version: 0.5.0
  description: >
    I5 Operational reads, reading history, hierarchy, authentication and policy. Health and
    documentation remain public.

    Domain endpoints use /v1 and JWT bearer authentication. Every user operation

    requires its documented scope; all errors use the Error schema.

    Demo password: Solar#Demo2026 (all seven seeded users).

    Demo logins: national.operator@slsea.lk, national.analyst@slsea.lk,

    western.province@slsea.lk, central.province@slsea.lk,

    colombo.district@slsea.lk, gampaha.district@slsea.lk, kandy.district@slsea.lk.
  license:
    name: Private project; all rights reserved
    url: https://www.energy.gov.lk/
servers:
  - url: /
    description: Current deployment origin; domain routes will be prefixed with /v1
security:
  - bearerAuth: []
tags:
  - name: Operations
    description: Public operational health checks
  - name: Documentation
    description: Public API documentation
  - name: Authentication
    description: User login and own profile
  - name: Hierarchy
    description: Jurisdiction-scoped provinces, districts, substations and installations
  - name: Readings
    description: Scoped analytical reading history; ingestion is added in I6
  - name: Operational
    description: Latest readings, freshness and installation overview
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Operations
      summary: Check application liveness
      description: Public; requires no scope. Does not check database connectivity in I0.
      security: []
      responses:
        '200':
          description: Application is running
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - &a1
          $ref: '#/components/parameters/IfMatch'
        - &a2
          $ref: '#/components/parameters/IfNoneMatch'
  /openapi.json:
    get:
      operationId: getOpenApi
      tags:
        - Documentation
      summary: Fetch the generated OpenAPI specification
      description: Public; requires no scope. Generated from openapi.yaml during build.
      security: []
      responses:
        '200':
          description: OpenAPI 3.0.3 document
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                required:
                  - openapi
                  - info
                  - paths
                properties:
                  openapi:
                    type: string
                  info:
                    type: object
                  paths:
                    type: object
              example:
                openapi: 3.0.3
                info:
                  title: SLSEA Solar Generation Data API
                  version: 0.0.0
                paths: {}
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - *a1
        - *a2
  /docs:
    get:
      operationId: getDocs
      tags:
        - Documentation
      summary: Open Swagger UI
      description: Public HTML documentation; requires no scope. Supports JWT Authorize.
      security: []
      responses:
        '200':
          description: Minimal HTML page loading pinned Swagger UI assets from a CDN
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            text/html:
              schema:
                type: string
              example: <!doctype html><html lang="en"><title>SLSEA API docs</title></html>
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - *a1
        - *a2
  /v1/auth/tokens:
    post:
      operationId: issueUserToken
      tags:
        - Authentication
      summary: Log in as a seeded SLSEA user
      description:
        'Public; requires no scope. Strict email/password body; lowercases email. Unknown email
        and wrong password return the same 401. Token responses use Cache-Control: no-store.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              email: national.operator@slsea.lk
              password: Solar#Demo2026
      responses:
        '200':
          description: User bearer token
          headers:
            X-Request-Id: &a3
              $ref: '#/components/headers/RequestId'
            Cache-Control: &a4
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400': &a5
          $ref: '#/components/responses/BadRequest'
        '401': &a6
          $ref: '#/components/responses/Unauthorized'
        '405': &a7
          $ref: '#/components/responses/MethodNotAllowed'
        '406': &a8
          $ref: '#/components/responses/NotAcceptable'
        '415': &a9
          $ref: '#/components/responses/UnsupportedMediaType'
        '500': &a10
          $ref: '#/components/responses/InternalError'
  /v1/users/me:
    get:
      operationId: getOwnProfile
      tags:
        - Authentication
      summary: Read the current user profile
      description:
        Requires a user token and account:manage scope. Password-version revocation is checked
        before returning public profile fields. No query parameters. Conditional ETag checks follow
        authentication and revocation.
      responses:
        '200':
          description: Current user profile
          headers:
            X-Request-Id: *a3
            Cache-Control: *a4
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '304':
          $ref: '#/components/responses/NotModified'
        '400': *a5
        '401': *a6
        '403':
          $ref: '#/components/responses/Forbidden'
        '405': *a7
        '406': *a8
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415': *a9
        '500': *a10
      parameters:
        - *a1
        - *a2
  /v1/provinces:
    get:
      operationId: listProvinces
      tags:
        - Hierarchy
      summary: list Provinces
      description:
        Requires a user token and generation:read scope. Jurisdiction is derived from the token
        and filters only narrow. Unknown IDs return 404; outside jurisdiction returns 403. Unknown
        query parameters return 400. Returns a filtered, paginated collection; count and page rows
        share a repeatable-read transaction. District users see only their district beneath their
        parent province. Empty collections use total_pages=0 with first/last page=1; a beyond-last
        page links prev to the last real page. Reporting/include options and reading resources
        arrive in later increments.
      parameters:
        - &a24
          $ref: '#/components/parameters/Page'
        - &a25
          $ref: '#/components/parameters/PageSize'
        - &a26
          $ref: '#/components/parameters/Sort'
        - *a1
        - *a2
      responses:
        '200':
          description: Jurisdiction-scoped collection
          headers:
            X-Request-Id: &a11
              $ref: '#/components/headers/RequestId'
            ETag: &a12
              $ref: '#/components/headers/ETag'
            Vary: &a13
              $ref: '#/components/headers/Vary'
            Cache-Control: &a14
              $ref: '#/components/headers/CacheControl'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceCollection'
        '304':
          $ref: '#/components/responses/NotModified'
        '400': &a15
          $ref: '#/components/responses/BadRequest'
        '401': &a16
          $ref: '#/components/responses/Unauthorized'
        '403': &a17
          $ref: '#/components/responses/Forbidden'
        '404': &a18
          $ref: '#/components/responses/NotFound'
        '405': &a19
          $ref: '#/components/responses/MethodNotAllowed'
        '406': &a20
          $ref: '#/components/responses/NotAcceptable'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415': &a21
          $ref: '#/components/responses/UnsupportedMediaType'
        '500': &a22
          $ref: '#/components/responses/InternalError'
  /v1/provinces/{provinceId}:
    get:
      operationId: getProvince
      tags:
        - Hierarchy
      summary: get Province
      description:
        Requires a user token and generation:read scope. Jurisdiction is derived from the token
        and filters only narrow. Unknown IDs return 404; outside jurisdiction returns 403. Unknown
