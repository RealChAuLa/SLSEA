components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Server-generated UUID shared by the response and logs
      schema:
        type: string
        format: uuid
      example: b6f1c0a2-0f5e-4d3a-9d6c-1d2a3b4c5d6e
    ETag:
      description:
        Strong SHA-256 hash of the serialized representation. If-Match uses strong comparison;
        If-None-Match uses weak comparison after authentication and authorization.
      schema:
        type: string
      example: '"representation-hash"'
    Vary:
      description: GET responses vary by Accept and Authorization, and Origin for CORS
      schema:
        type: string
      example: Accept, Authorization, Origin
    Location:
      description: Absolute URI of a newly created resource (introduced in I6)
      schema:
        type: string
        format: uri
    LastModified:
      description: Timestamp of the source data (introduced in I4)
      schema:
        type: string
    Link:
      description: RFC 8288 first/prev/next/last links; null relations are omitted.
      schema:
        type: string
      example: <https://api.example.test/v1/provinces?page=1&page_size=50>; rel="first"
    CacheControl:
      description: Authenticated GETs require revalidation; token responses forbid caching.
      schema:
        type: string
      example: private, no-cache
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - status
            - details
            - request_id
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - MALFORMED_JSON
                - INVALID_QUERY
                - UNAUTHENTICATED
                - TOKEN_EXPIRED
                - TOKEN_REVOKED
                - FORBIDDEN_SCOPE
                - FORBIDDEN_JURISDICTION
                - FORBIDDEN_INSTALLATION
                - CURRENT_PASSWORD_INCORRECT
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - NOT_ACCEPTABLE
                - DUPLICATE_READING
                - PRECONDITION_FAILED
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
            status:
              type: integer
              minimum: 400
              maximum: 599
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - field
                  - issue
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            request_id:
              type: string
              format: uuid
      example:
        error:
          code: NOT_FOUND
          message: The requested resource was not found.
          status: 404
          details: []
          request_id: b6f1c0a2-0f5e-4d3a-9d6c-1d2a3b4c5d6e
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - page_size
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    Links:
      type: object
      additionalProperties: false
      required:
        - self
        - first
        - prev
        - next
        - last
      properties:
        self:
          type: string
          format: uri
        first:
          type: string
          format: uri
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
    Login:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          description: Maximum 72 UTF-8 bytes.
    Token:
      type: object
      additionalProperties: false
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
        scope:
          type: string
          enum:
            - generation:read account:manage
    User:
      type: object
      additionalProperties: false
      required:
        - user_id
        - name
        - email
        - jurisdiction_type
        - jurisdiction_id
      properties:
        user_id:
          type: integer
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
        jurisdiction_type:
          type: string
          enum:
            - national
            - provincial
            - district
        jurisdiction_id:
          type: integer
          nullable: true
          minimum: 1
    Province:
      type: object
      additionalProperties: false
      required:
        - province_id
        - name
      properties:
        province_id: *a23
        name:
          type: string
    District:
      type: object
      additionalProperties: false
      required:
        - district_id
        - name
        - province_id
      properties:
        district_id: *a23
        name:
          type: string
        province_id: *a23
    GridSubstation:
      type: object
      additionalProperties: false
      required:
        - substation_id
        - name
        - district_id
      properties:
        substation_id: *a23
        name:
          type: string
        district_id: *a23
    SolarInstallation:
      type: object
      additionalProperties: false
      required:
        - site_id
        - name
        - meter_id
        - latitude
        - longitude
        - substation_id
      properties:
        site_id: *a23
        name:
          type: string
        meter_id:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        substation_id: *a23
    ProvinceCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Province'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
    DistrictCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/District'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
    GridSubstationCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GridSubstation'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
    SolarInstallationCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SolarInstallation'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description:
        Positive integer page. Out-of-range pages return empty data with correct totals;
        database offset must fit a signed 32-bit integer.
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      description:
        Positive integer page size; defaults and maximum come from runtime configuration (50
        and 500).
    Sort:
      name: sort
      in: query
      description:
        Sort by name ascending/descending; defaults to primary key ascending. Primary key
        breaks name ties.
      schema:
        type: string
        enum:
          - name
          - -name
    From:
      name: from
      in: query
      description: Inclusive ISO-8601 timestamp with Z or a timezone offset
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Exclusive ISO-8601 timestamp with Z or a timezone offset
      schema:
        type: string
        format: date-time
    ProvinceId:
      name: province_id
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    DistrictId:
      name: district_id
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    SubstationId:
      name: substation_id
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    SiteId:
      name: site_id
      in: query
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      description:
        Strong comparison; mismatching tags return 412 after access checks. Supports an
        entity-tag list or *.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description:
        Weak comparison; a matching tag returns an empty 304 after access checks. Evaluated
        after If-Match.
      schema:
        type: string
  responses:
    BadRequest:
      description:
        Malformed JSON, invalid input, or body larger than 10 kb (400 VALIDATION_FAILED for
        size; contract has no 413)
      headers: &a27
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content: &a28
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token
      headers:
        <<: *a27
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content: *a28
    Forbidden:
      description: Principal lacks the required scope or jurisdiction
      headers: *a27
      content: *a28
    NotFound:
      description: Unknown resource or route
      headers: *a27
      content: *a28
    MethodNotAllowed:
      description: Method is unsupported on a known URI
      headers:
        <<: *a27
        Allow:
          description: Comma-separated supported methods
          schema:
            type: string
          example: GET
      content: *a28
    NotAcceptable:
      description: Accept does not permit the offered representation (JSON, or HTML for /docs)
      headers: *a27
      content: *a28
    Conflict:
      description: Duplicate reading
      headers: *a27
      content: *a28
    PreconditionFailed:
      description: The GET If-Match condition fails after authentication and authorization (strong comparison).
      headers: *a27
      content: *a28
    UnsupportedMediaType:
      description: A write requires application/json, or the JSON charset or encoding is unsupported
      headers: *a27
      content: *a28
    RateLimited:
      description: Too many requests
      headers: *a27
      content: *a28
    InternalError:
      description: Unhandled server fault; generic message without implementation details
      headers: *a27
      content: *a28
    NotModified:
      description: Current representation; empty response body. Access checks run before ETag comparison.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
        Vary:
          $ref: '#/components/headers/Vary'
