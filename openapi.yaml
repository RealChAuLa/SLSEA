  /v1/installations/{siteId}/readings:
    get:
      operationId: listSiteReadings
      tags:
        - Readings
      summary: Read scoped measurement history
      description:
        'Requires user token and generation:read. Unknown query fields are rejected. Parent and
        each filter are resolved/authorized first; filters only narrow. UTC output; from inclusive
        and to exclusive. Site history from/to are optional with no default window. Sort defaults to
        newest first. Last-Modified is newest timestamp on the selected page and is omitted for
        empty pages. Encode + as %2B in query offsets; example: ?from=2026-10-09T00:00:00%2B05:30.'
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ReadingSort'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: Paginated measurement history
          headers:
            X-Request-Id: &a27
              $ref: '#/components/headers/RequestId'
            ETag: &a28
              $ref: '#/components/headers/ETag'
            Vary: &a29
              $ref: '#/components/headers/Vary'
            Cache-Control: &a30
              $ref: '#/components/headers/CacheControl'
            Last-Modified: &a31
              $ref: '#/components/headers/LastModified'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingCollection'
        '304': &a32
          $ref: '#/components/responses/NotModified'
        '400': &a33
          $ref: '#/components/responses/BadRequest'
        '401': &a34
          $ref: '#/components/responses/Unauthorized'
        '403': &a35
          $ref: '#/components/responses/Forbidden'
        '404': &a36
          $ref: '#/components/responses/NotFound'
        '405': &a37
          $ref: '#/components/responses/MethodNotAllowed'
        '406': &a38
          $ref: '#/components/responses/NotAcceptable'
        '412': &a39
          $ref: '#/components/responses/PreconditionFailed'
        '415': &a40
          $ref: '#/components/responses/UnsupportedMediaType'
        '500': &a41
          $ref: '#/components/responses/InternalError'
  /v1/installations/{siteId}/readings/{timestamp}:
    get:
      operationId: getReading
      tags:
        - Readings
      summary: Read one measurement
      description:
        'Requires user token and generation:read. Unknown query fields are rejected. Parent and
        each filter are resolved/authorized first; filters only narrow. UTC output; from inclusive
        and to exclusive. Site history from/to are optional with no default window. Sort defaults to
        newest first. Last-Modified is newest timestamp on the selected page and is omitted for
        empty pages. Encode + as %2B in query offsets; example: ?from=2026-10-09T00:00:00%2B05:30.'
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: timestamp
          in: path
          required: true
          schema:
            type: string
            format: date-time
          description: URL-encoded ISO timestamp with Z or timezone offset; canonical responses use UTC.
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: Reading measurement
          headers:
            X-Request-Id: *a27
            ETag: *a28
            Vary: *a29
            Cache-Control: *a30
            Last-Modified: *a31
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationReading'
        '304': *a32
        '400': *a33
        '401': *a34
        '403': *a35
        '404': *a36
        '405': *a37
        '406': *a38
        '412': *a39
        '415': *a40
        '500': *a41
  /v1/readings:
    get:
      operationId: listReadings
      tags:
        - Readings
      summary: Read scoped measurement history
      description:
        'Requires user token and generation:read. Unknown query fields are rejected. Parent and
        each filter are resolved/authorized first; filters only narrow. UTC output; from inclusive
        and to exclusive. Default to=now, from=to-24h; maximum span 31 days. Filters are ANDed. Sort
        defaults to newest first. Last-Modified is newest timestamp on the selected page and is
        omitted for empty pages. Encode + as %2B in query offsets; example:
        ?from=2026-10-09T00:00:00%2B05:30.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ReadingSort'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ProvinceId'
        - $ref: '#/components/parameters/DistrictId'
        - $ref: '#/components/parameters/SubstationId'
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: Paginated measurement history
          headers:
            X-Request-Id: *a27
            ETag: *a28
            Vary: *a29
            Cache-Control: *a30
            Last-Modified: *a31
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingCollection'
        '304': *a32
        '400': *a33
        '401': *a34
        '403': *a35
        '404': *a36
        '405': *a37
        '406': *a38
        '412': *a39
        '415': *a40
        '500': *a41
  /v1/installations/{siteId}/last-known-reading:
    get:
      operationId: getLastKnownReading
      tags:
        - Operational
      summary: Read latest measurement and freshness
      description:
        Requires a user token and generation:read scope. Unknown query parameters are rejected.
        Authorization precedes any conditional result. Newest measurement ordered by timestamp
        descending. Empty installation returns 404. age_seconds is nonnegative whole seconds;
        is_stale uses the exact inclusive freshness threshold (default 30 minutes). Last-Modified is
        the reading timestamp.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: Latest measurement including freshness
          headers:
            X-Request-Id: &a42
              $ref: '#/components/headers/RequestId'
            ETag: &a43
              $ref: '#/components/headers/ETag'
            Vary: &a44
              $ref: '#/components/headers/Vary'
            Cache-Control: &a45
              $ref: '#/components/headers/CacheControl'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastKnownReading'
              example:
                site_id: 1
                meter_id: MTR-0001
                timestamp: 2026-10-09T12:00:00.000Z
                power_Kw: 2.31
                cumulative_energy_Kwh: 18234.52
                voltage: 231.4
                age_seconds: 412
                is_stale: false
        '304': &a46
          $ref: '#/components/responses/NotModified'
        '400': &a47
          $ref: '#/components/responses/BadRequest'
        '401': &a48
          $ref: '#/components/responses/Unauthorized'
        '403': &a49
          $ref: '#/components/responses/Forbidden'
        '404': &a50
          $ref: '#/components/responses/NotFound'
        '405': &a51
          $ref: '#/components/responses/MethodNotAllowed'
        '406': &a52
          $ref: '#/components/responses/NotAcceptable'
        '412': &a53
          $ref: '#/components/responses/PreconditionFailed'
        '415': &a54
          $ref: '#/components/responses/UnsupportedMediaType'
        '500': &a55
          $ref: '#/components/responses/InternalError'
  /v1/installations/{siteId}/overview:
    get:
      operationId: getInstallationOverview
      tags:
        - Operational
      summary: Read installation hierarchy and today totals
      description:
        Requires a user token and generation:read scope. Unknown query parameters are rejected.
        Authorization precedes any conditional result. Bare installation fields with parent id/name
        objects, compact nullable latest reading and Asia/Colombo today totals. Today uses latest
        today minus previous-day baseline, falling back to first reading today. Empty today returns
        zeros; negative counter deltas clamp to zero. No Last-Modified on this composite.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Composite installation overview
          headers:
            X-Request-Id: *a42
            ETag: *a43
            Vary: *a44
            Cache-Control: *a45
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationOverview'
              example:
                site_id: 1
                name: Colombo Rooftop Solar 1
                meter_id: MTR-0001
                latitude: 6.93112
                longitude: 79.85934
                substation_id: 1
                substation:
                  substation_id: 1
                  name: Colombo Grid Substation 1
                district:
                  district_id: 1
                  name: Colombo
                province:
                  province_id: 1
                  name: Western
                last_known_reading:
                  timestamp: 2026-10-09T12:00:00.000Z
                  power_Kw: 2.31
                  cumulative_energy_Kwh: 18234.52
                  voltage: 231.4
                  age_seconds: 412
                  is_stale: false
                today:
                  energy_Kwh: 15
                  peak_power_Kw: 4
                  reading_count: 3
        '304': *a46
        '400': *a47
        '401': *a48
        '403': *a49
        '404': *a50
        '405': *a51
        '406': *a52
        '412': *a53
        '415': *a54
        '500': *a55
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Server-generated UUID shared by the response and logs
      schema:
        type: string
        format: uuid
      example: b6f1c0a2-0f5e-4d3a-9d6c-1d2a3b4c5d6e
    ETag:
      description:
        Strong SHA-256 hash of the serialized representation. If-Match uses strong comparison;
        If-None-Match uses weak comparison after authentication and authorization.
      schema:
        type: string
      example: '"representation-hash"'
    Vary:
      description: GET responses vary by Accept and Authorization, and Origin for CORS
      schema:
        type: string
      example: Accept, Authorization, Origin
    Location:
      description: Absolute URI of a newly created resource (introduced in I6)
      schema:
        type: string
        format: uri
    LastModified:
      description:
        Measurement source timestamp for reading resources; omitted on empty pages,
        installation lists, metadata and overview.
      schema:
        type: string
    Link:
      description: RFC 8288 first/prev/next/last links; null relations are omitted.
      schema:
        type: string
      example: <https://api.example.test/v1/provinces?page=1&page_size=50>; rel="first"
    CacheControl:
      description: Authenticated GETs require revalidation; token responses forbid caching.
      schema:
        type: string
      example: private, no-cache
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - status
            - details
            - request_id
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - MALFORMED_JSON
                - INVALID_QUERY
                - UNAUTHENTICATED
                - TOKEN_EXPIRED
                - TOKEN_REVOKED
                - FORBIDDEN_SCOPE
                - FORBIDDEN_JURISDICTION
                - FORBIDDEN_INSTALLATION
                - CURRENT_PASSWORD_INCORRECT
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - NOT_ACCEPTABLE
                - DUPLICATE_READING
                - PRECONDITION_FAILED
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
            status:
              type: integer
              minimum: 400
              maximum: 599
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - field
                  - issue
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            request_id:
              type: string
              format: uuid
      example:
        error:
          code: NOT_FOUND
          message: The requested resource was not found.
          status: 404
          details: []
          request_id: b6f1c0a2-0f5e-4d3a-9d6c-1d2a3b4c5d6e
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - page_size
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    Links:
      type: object
      additionalProperties: false
      required:
        - self
        - first
        - prev
        - next
        - last
      properties:
        self:
          type: string
          format: uri
        first:
          type: string
          format: uri
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
    Login:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          description: Maximum 72 UTF-8 bytes.
    Token:
      type: object
      additionalProperties: false
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
        scope:
          type: string
          enum:
            - generation:read account:manage
    User:
      type: object
      additionalProperties: false
      required:
        - user_id
        - name
        - email
        - jurisdiction_type
        - jurisdiction_id
      properties:
        user_id:
          type: integer
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
        jurisdiction_type:
          type: string
          enum:
            - national
            - provincial
            - district
        jurisdiction_id:
          type: integer
          nullable: true
          minimum: 1
    Province:
      type: object
      additionalProperties: false
      required:
        - province_id
        - name
      properties:
        province_id: *a23
        name:
          type: string
    District:
      type: object
      additionalProperties: false
      required:
        - district_id
        - name
        - province_id
      properties:
        district_id: *a23
        name:
          type: string
        province_id: *a23
    GridSubstation:
      type: object
      additionalProperties: false
      required:
        - substation_id
        - name
        - district_id
      properties:
        substation_id: *a23
        name:
          type: string
        district_id: *a23
    SolarInstallation:
      type: object
      additionalProperties: false
      required: &a64
        - site_id
        - name
        - meter_id
        - latitude
        - longitude
        - substation_id
      properties:
        site_id: *a23
        name: &a65
          type: string
        meter_id: &a66
          type: string
        latitude: &a67
          type: number
          minimum: -90
          maximum: 90
        longitude: &a68
          type: number
          minimum: -180
          maximum: 180
        substation_id: *a23
    ProvinceCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Province'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
    DistrictCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/District'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
    GridSubstationCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GridSubstation'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
    SolarInstallationCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SolarInstallationWithLatest'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
    GenerationReading:
      type: object
      additionalProperties: false
      required:
        - site_id
        - meter_id
        - timestamp
        - power_Kw
        - cumulative_energy_Kwh
        - voltage
      properties:
        site_id: &a56
          type: integer
          minimum: 1
        meter_id: &a57
          type: string
        timestamp: &a58
          type: string
          format: date-time
        power_Kw: &a59
          type: number
          minimum: 0
        cumulative_energy_Kwh: &a60
          type: number
          minimum: 0
        voltage: &a61
          type: number
          exclusiveMinimum: true
          minimum: 0
    ReadingCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GenerationReading'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'
    LastKnownReading:
      type: object
      additionalProperties: false
      required:
        - site_id
        - meter_id
        - timestamp
        - power_Kw
        - cumulative_energy_Kwh
        - voltage
        - age_seconds
        - is_stale
      properties:
        site_id: *a56
        meter_id: *a57
        timestamp: *a58
        power_Kw: *a59
        cumulative_energy_Kwh: *a60
        voltage: *a61
        age_seconds: &a62
          type: integer
          minimum: 0
        is_stale: &a63
          type: boolean
    LatestReadingSummary:
      type: object
      additionalProperties: false
      required: &a69
        - timestamp
        - power_Kw
        - cumulative_energy_Kwh
        - voltage
        - age_seconds
        - is_stale
      properties: &a70
        timestamp: *a58
        power_Kw: *a59
        cumulative_energy_Kwh: *a60
        voltage: *a61
        age_seconds: *a62
        is_stale: *a63
    SolarInstallationWithLatest:
      type: object
      additionalProperties: false
      required: *a64
      properties:
        site_id: *a23
        name: *a65
        meter_id: *a66
        latitude: *a67
        longitude: *a68
        substation_id: *a23
        last_known_reading: &a71
          type: object
          additionalProperties: false
          required: *a69
          properties: *a70
          nullable: true
    InstallationOverview:
      type: object
      additionalProperties: false
      required:
        - site_id
        - name
        - meter_id
        - latitude
        - longitude
        - substation_id
        - substation
        - district
        - province
        - last_known_reading
        - today
      properties:
        site_id: *a23
        name: *a65
        meter_id: *a66
        latitude: *a67
        longitude: *a68
        substation_id: *a23
        substation:
          type: object
          additionalProperties: false
          required:
            - substation_id
            - name
          properties:
            substation_id:
              type: integer
              minimum: 1
            name:
              type: string
        district:
          type: object
          additionalProperties: false
          required:
            - district_id
            - name
          properties:
            district_id:
              type: integer
              minimum: 1
            name:
              type: string
        province:
          $ref: '#/components/schemas/Province'
        last_known_reading: *a71
        today:
          type: object
          additionalProperties: false
          required:
            - energy_Kwh
            - peak_power_Kw
            - reading_count
          properties:
            energy_Kwh:
              type: number
              minimum: 0
            peak_power_Kw:
              type: number
              minimum: 0
            reading_count:
              type: integer
              minimum: 0
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description:
        Positive integer page. Out-of-range pages return empty data with correct totals;
        database offset must fit a signed 32-bit integer.
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      description:
        Positive integer page size; defaults and maximum come from runtime configuration (50
        and 500).
    Sort:
      name: sort
      in: query
      description:
        Sort by name ascending/descending; defaults to primary key ascending. Primary key
        breaks name ties.
      schema:
        type: string
        enum:
          - name
          - -name
    From:
      name: from
      in: query
      description:
        Inclusive ISO-8601 timestamp with Z or a timezone offset; offsets with + must encode it
        as %2B in the URL.
      schema:
        type: string
        format: date-time
      example: 2026-10-09T00:00:00+05:30
    To:
      name: to
      in: query
      description:
        Exclusive ISO-8601 timestamp with Z or a timezone offset; offsets with + must encode it
        as %2B in the URL.
      schema:
        type: string
        format: date-time
      example: 2026-10-10T00:00:00+05:30
    ProvinceId:
      name: province_id
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    DistrictId:
      name: district_id
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    SubstationId:
      name: substation_id
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    SiteId:
      name: site_id
      in: query
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      description:
        Strong comparison; mismatching tags return 412 after access checks. Supports an
        entity-tag list or *.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description:
        Weak comparison; a matching tag returns an empty 304 after access checks. Evaluated
        after If-Match.
      schema:
        type: string
    ReadingSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - timestamp
          - -timestamp
        default: -timestamp
      description: Chronological ordering with meter_id ascending to break timestamp ties.
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      schema:
        type: string
      description:
        HTTP date. Honored only when Last-Modified exists and If-None-Match is absent. All
        access checks and If-Match run first.
    Reporting:
      name: reporting
      in: query
      description:
        'Filter before count/pagination: true for latest measurement no older than
        STALE_AFTER_MINUTES (default 30), false for stale or never reported. Strictly true/false.'
      schema:
        type: boolean
    Include:
      name: include
      in: query
      description:
        Attach the latest reading for each paged installation in one query, without duplicate
        IDs; null when absent.
      schema:
        type: string
        enum:
          - last_known_reading
  responses:
    BadRequest:
      description:
        Malformed JSON, invalid input, or body larger than 10 kb (400 VALIDATION_FAILED for
        size; contract has no 413)
      headers: &a72
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content: &a73
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token
      headers:
        <<: *a72
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content: *a73
    Forbidden:
      description: Principal lacks the required scope or jurisdiction
      headers: *a72
      content: *a73
    NotFound:
      description: Unknown resource or route
      headers: *a72
      content: *a73
    MethodNotAllowed:
      description: Method is unsupported on a known URI
      headers:
        <<: *a72
        Allow:
          description: Comma-separated supported methods
          schema:
            type: string
          example: GET
      content: *a73
    NotAcceptable:
      description: Accept does not permit the offered representation (JSON, or HTML for /docs)
      headers: *a72
      content: *a73
    Conflict:
      description: Duplicate reading
      headers: *a72
      content: *a73
    PreconditionFailed:
      description: The GET If-Match condition fails after authentication and authorization (strong comparison).
      headers: *a72
      content: *a73
    UnsupportedMediaType:
      description: A write requires application/json, or the JSON charset or encoding is unsupported
      headers: *a72
      content: *a73
    RateLimited:
      description: Too many requests
      headers: *a72
      content: *a73
    InternalError:
      description: Unhandled server fault; generic message without implementation details
      headers: *a72
      content: *a73
    NotModified:
      description: Current representation; empty response body. Access checks run before ETag comparison.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
        Vary:
          $ref: '#/components/headers/Vary'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
