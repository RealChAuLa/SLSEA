  /v1/grid-substations/{substationId}/installations:
    get:
      operationId: listSubstationInstallations
      tags:
        - Hierarchy
      summary: list Substation Installations
      description:
        Requires a user token and generation:read scope. Jurisdiction is derived from the token
        and filters only narrow. Unknown IDs return 404; outside jurisdiction returns 403. Unknown
        query parameters return 400. Returns a filtered, paginated collection; count and page rows
        share a repeatable-read transaction. District users see only their district beneath their
        parent province. Empty collections use total_pages=0 with first/last page=1; a beyond-last
        page links prev to the last real page. reporting=true|false is applied before counts and
        pagination; include=last_known_reading fetches only page meters in one query. The list
        remains jurisdiction scoped. Nested readings omit site_id/meter_id and use null for no
        readings.
      parameters:
        - name: substationId
          in: path
          required: true
          schema: *a23
        - *a24
        - *a25
        - *a26
        - *a1
        - *a2
        - $ref: '#/components/parameters/Reporting'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Jurisdiction-scoped collection
          headers:
            X-Request-Id: *a11
            ETag: *a12
            Vary: *a13
            Cache-Control: *a14
            Link:
              $ref: '#/components/headers/Link'
          content:
