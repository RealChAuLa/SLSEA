        parent province metadata for navigation. Reporting/include options and reading resources
        arrive in later increments.
      parameters:
        - name: provinceId
          in: path
          required: true
          schema: &a23
            type: integer
            minimum: 1
            maximum: 2147483647
        - *a1
        - *a2
      responses:
        '200':
          description: Public resource fields
          headers:
            X-Request-Id: *a11
            ETag: *a12
            Vary: *a13
            Cache-Control: *a14
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Province'
        '304':
          $ref: '#/components/responses/NotModified'
        '400': *a15
        '401': *a16
        '403': *a17
        '404': *a18
        '405': *a19
        '406': *a20
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415': *a21
        '500': *a22
