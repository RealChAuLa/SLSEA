openapi: 3.0.3
info:
  title: SLSEA Solar Generation Data API
  version: 0.0.0
  description: |
    I0 Foundations: public health and documentation endpoints only.
    Domain endpoints will use /v1 and JWT bearer authentication in later increments.
    Required scope for every operation currently present: none (public).
    Errors always use the Error schema, including a UUID request_id.
    The /docs HTML surface is the sole exception to the JSON representation rule.
    Demo logins become available with the I1 seed and I2 authentication increments.
  license:
    name: Private project; all rights reserved
    url: https://www.energy.gov.lk/
servers:
  - url: /
    description: Current deployment origin; domain routes will be prefixed with /v1
security:
  - bearerAuth: []
tags:
  - name: Operations
    description: Public operational health checks
  - name: Documentation
    description: Public API documentation
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Check application liveness
      description: Public; requires no scope. Does not check database connectivity in I0.
      security: []
      responses:
        '200':
          description: Application is running
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example: { status: ok }
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /openapi.json:
    get:
      operationId: getOpenApi
      tags: [Documentation]
      summary: Fetch the generated OpenAPI specification
      description: Public; requires no scope. Generated from openapi.yaml during build.
      security: []
      responses:
        '200':
          description: OpenAPI 3.0.3 document
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                  info:
                    type: object
                  paths:
                    type: object
              example:
                openapi: 3.0.3
                info: { title: SLSEA Solar Generation Data API, version: 0.0.0 }
                paths: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /docs:
    get:
      operationId: getDocs
      tags: [Documentation]
      summary: Open Swagger UI
      description: Public HTML documentation; requires no scope. Supports JWT Authorize.
      security: []
      responses:
        '200':
          description: Minimal HTML page loading pinned Swagger UI assets from a CDN
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            text/html:
              schema:
                type: string
              example: '<!doctype html><html lang="en"><title>SLSEA API docs</title></html>'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Server-generated UUID shared by the response and logs
      schema: { type: string, format: uuid }
      example: b6f1c0a2-0f5e-4d3a-9d6c-1d2a3b4c5d6e
    ETag:
      description: Hash of the serialized successful GET representation; conditional evaluation arrives in I3
      schema: { type: string }
      example: '"representation-hash"'
    Vary:
      description: GET responses vary by Accept and Authorization, and Origin for CORS
      schema: { type: string }
      example: Accept, Authorization, Origin
    Location:
      description: Absolute URI of a newly created resource (introduced in I6)
      schema: { type: string, format: uri }
    LastModified:
      description: Timestamp of the source data (introduced in I4)
      schema: { type: string }
    Link:
      description: RFC 8288 pagination links (introduced in I3)
      schema: { type: string }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, status, details, request_id]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_FAILED,
                  MALFORMED_JSON,
                  INVALID_QUERY,
                  UNAUTHENTICATED,
                  TOKEN_EXPIRED,
                  TOKEN_REVOKED,
                  FORBIDDEN_SCOPE,
                  FORBIDDEN_JURISDICTION,
                  FORBIDDEN_INSTALLATION,
                  CURRENT_PASSWORD_INCORRECT,
                  NOT_FOUND,
                  METHOD_NOT_ALLOWED,
                  NOT_ACCEPTABLE,
                  DUPLICATE_READING,
                  PRECONDITION_FAILED,
                  UNSUPPORTED_MEDIA_TYPE,
                  RATE_LIMITED,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            status: { type: integer, minimum: 400, maximum: 599 }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }
            request_id: { type: string, format: uuid }
      example:
        error:
          code: NOT_FOUND
          message: The requested resource was not found.
          status: 404
          details: []
          request_id: b6f1c0a2-0f5e-4d3a-9d6c-1d2a3b4c5d6e
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total_count, total_pages]
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        page_size: { type: integer, minimum: 1, maximum: 500, default: 50 }
        total_count: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    Links:
      type: object
      additionalProperties: false
      required: [self, first, prev, next, last]
      properties:
        self: { type: string, format: uri }
        first: { type: string, format: uri }
        prev: { type: string, format: uri, nullable: true }
        next: { type: string, format: uri, nullable: true }
        last: { type: string, format: uri }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Sort:
      name: sort
      in: query
      description: Endpoint-specific allowlist; prefix with - for descending order
      schema: { type: string }
    From:
      name: from
      in: query
      description: Inclusive ISO-8601 timestamp with Z or a timezone offset
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Exclusive ISO-8601 timestamp with Z or a timezone offset
      schema: { type: string, format: date-time }
    ProvinceId:
      name: province_id
      in: query
      schema: { type: integer, minimum: 1 }
    DistrictId:
      name: district_id
      in: query
      schema: { type: integer, minimum: 1 }
    SubstationId:
      name: substation_id
      in: query
      schema: { type: integer, minimum: 1 }
    SiteId:
      name: site_id
      in: query
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Malformed JSON, invalid input, or body larger than 10 kb (400 VALIDATION_FAILED for size; contract has no 413)
      headers: &errorHeaders
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content: &errorContent
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token
      headers:
        <<: *errorHeaders
        WWW-Authenticate:
          schema: { type: string }
          example: Bearer
      content: *errorContent
    Forbidden:
      description: Principal lacks the required scope or jurisdiction
      headers: *errorHeaders
      content: *errorContent
    NotFound:
      description: Unknown resource or route
      headers: *errorHeaders
      content: *errorContent
    MethodNotAllowed:
      description: Method is unsupported on a known URI
      headers:
        <<: *errorHeaders
        Allow:
          description: Comma-separated supported methods
          schema: { type: string }
          example: GET
      content: *errorContent
    NotAcceptable:
      description: Accept does not permit the offered representation (JSON, or HTML for /docs)
      headers: *errorHeaders
      content: *errorContent
    Conflict:
      description: Duplicate reading
      headers: *errorHeaders
      content: *errorContent
    PreconditionFailed:
      description: A GET If-Match condition does not match the current representation (I3)
      headers: *errorHeaders
      content: *errorContent
    UnsupportedMediaType:
      description: A write requires application/json, or the JSON charset or encoding is unsupported
      headers: *errorHeaders
      content: *errorContent
    RateLimited:
      description: Too many requests
      headers: *errorHeaders
      content: *errorContent
    InternalError:
      description: Unhandled server fault; generic message without implementation details
      headers: *errorHeaders
      content: *errorContent
    NotModified:
      description: Current representation; empty response body (introduced in I3)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
