      summary: list Installations
      description:
        Requires a user token and generation:read scope. Jurisdiction is derived from the token
        and filters only narrow. Unknown IDs return 404; outside jurisdiction returns 403. Unknown
        query parameters return 400. Returns a filtered, paginated collection; count and page rows
        share a repeatable-read transaction. District users see only their district beneath their
        parent province. Empty collections use total_pages=0 with first/last page=1; a beyond-last
        page links prev to the last real page. Each supplied filter ID is independently authorized;
        filters are ANDed and contradictory authorized filters return an empty set.
        reporting=true|false is applied before counts and pagination; include=last_known_reading
        fetches only page meters in one query. The list remains jurisdiction scoped. Nested readings
        omit site_id/meter_id and use null for no readings.
