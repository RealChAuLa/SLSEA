name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slsea_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: slsea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slsea_test -d slsea_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://slsea_test:ci_only_password@localhost:5432/slsea_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run spec:lint
      - run: npm test
